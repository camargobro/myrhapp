<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Folha de Pagamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <h1>Folha de Pagamento</h1>
            <span id="statusApi" class="status-api">conectando…</span>
        </div>
    </header>

    <main class="page">

        <div class="grid">
            <section class="panel">
                <div class="panel-head">
                    <h2 id="tituloForm">Novo colaborador</h2>
                </div>

                <form id="formColaborador" novalidate>
                    <div class="field-row">
                        <div class="field field-sm">
                            <label for="matricula">Matrícula</label>
                            <input type="number" id="matricula" min="1" step="1" required>
                        </div>
                        <div class="field">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" required>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="salarioBase">Salário base (R$)</label>
                            <input type="number" id="salarioBase" step="0.01" min="0" required>
                        </div>
                        <div class="field">
                            <label for="tipo">Tipo</label>
                            <select id="tipo">
                                <option value="PADRAO">Padrão</option>
                                <option value="COMISSIONADO">Comissionado</option>
                                <option value="PRODUCAO">Por produção</option>
                            </select>
                        </div>
                    </div>

                    <div id="camposComissionado" class="field-row extra hidden">
                        <div class="field">
                            <label for="valorVendas">Valor das vendas (R$)</label>
                            <input type="number" id="valorVendas" step="0.01" min="0" value="0">
                        </div>
                        <div class="field">
                            <label for="percentualComissao">Comissão (%)</label>
                            <input type="number" id="percentualComissao" step="0.01" min="0" value="0">
                        </div>
                    </div>

                    <div id="camposProducao" class="field-row extra hidden">
                        <div class="field">
                            <label for="quantidadeProduzida">Qtd. produzida</label>
                            <input type="number" id="quantidadeProduzida" min="0" value="0">
                        </div>
                        <div class="field">
                            <label for="valorPorUnidade">Valor por unidade (R$)</label>
                            <input type="number" id="valorPorUnidade" step="0.01" min="0" value="0">
                        </div>
                    </div>

                    <p id="msgForm" class="msg" role="status"></p>

                    <div class="actions">
                        <button type="submit" id="btnSalvar" class="btn btn-primary">Salvar</button>
                        <button type="button" id="btnLimpar" class="btn">Limpar</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Colaboradores</h2>
                    <span id="contador" class="muted"></span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Mat.</th>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th class="num">Salário base</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaColaboradores"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h2>Folha de pagamento</h2>
                <button type="button" id="btnGerarFolha" class="btn btn-primary">Gerar folha</button>
            </div>

            <div id="areaRelatorio" class="hidden">
                <div class="resumo">
                    <div class="resumo-item">
                        <span class="resumo-label">Colaboradores</span>
                        <span class="resumo-valor" id="resumoQtd">0</span>
                    </div>
                    <div class="resumo-item">
                        <span class="resumo-label">Salários base</span>
                        <span class="resumo-valor" id="resumoBase">—</span>
                    </div>
                    <div class="resumo-item">
                        <span class="resumo-label">Adicionais</span>
                        <span class="resumo-valor" id="resumoAdicionais">—</span>
                    </div>
                    <div class="resumo-item destaque">
                        <span class="resumo-label">Total da folha</span>
                        <span class="resumo-valor" id="resumoTotal">—</span>
                    </div>
                </div>

                <p class="por-tipo" id="resumoPorTipo"></p>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Mat.</th>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th class="num">Salário base</th>
                                <th class="num">Adicionais</th>
                                <th class="num">Salário final</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaFolha"></tbody>
                    </table>
                </div>
            </div>
            <p id="folhaVazia" class="muted">Clique em “Gerar folha” para calcular os salários.</p>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
